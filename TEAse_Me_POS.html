<!doctype html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TEAse Me POS</title>
<link href="https://fonts.googleapis.com/css2?family=Chango&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#fbe8d3;--card:#fffaf3;--ink:#161212;--mut:#7a6458;--line:#161212;--acc:#d7263d;--on:#fff;--grn:#2f7d4f;--ok:#2f7d4f;--bad:#b3162a;--hd:#f7d4b5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1512;--card:#2a1f1a;--ink:#fbe8d3;--mut:#c4a893;--line:#fbe8d3;--acc:#ff5a6e;--on:#1d0f12;--grn:#6fcf97;--ok:#6fcf97;--bad:#ff7b8a;--hd:#2a1f1a}}
:root[data-theme="dark"]{--bg:#1d1512;--card:#2a1f1a;--ink:#fbe8d3;--mut:#c4a893;--line:#fbe8d3;--acc:#ff5a6e;--on:#1d0f12;--grn:#6fcf97;--ok:#6fcf97;--bad:#ff7b8a;--hd:#2a1f1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hd)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--hd);padding:8px 12px 0;border-bottom:3px solid var(--line)}
header::after{content:"";display:block;height:12px;margin:8px -12px 0;background:radial-gradient(circle,var(--line) 3px,transparent 3.6px) 0 0/18px 12px}
.top{display:flex;align-items:center;gap:10px}
.top b{font-family:Chango,"Arial Black",Impact,sans-serif;font-weight:400;font-size:20px}
#st{margin-left:auto}
#logo{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:#f7d4b5;display:grid;place-items:center;overflow:hidden;font-size:15px;flex:none}
.mut,small{color:var(--mut)}
#tabs{display:flex;gap:6px;margin-top:8px}
#tabs button{flex:1;padding:8px 0;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-weight:800}
#tabs button.on{background:var(--grn);color:var(--on)}
main{padding:12px 12px 120px;max-width:640px;margin:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.item{padding:14px 8px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;border-radius:16px;box-shadow:3px 3px 0 var(--line)}
.item b{color:var(--acc);font-family:Chango,"Arial Black",Impact,sans-serif;font-weight:400}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}
.qty{display:flex;align-items:center;gap:10px}
button{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px}
button:disabled{opacity:.4}
.pri{background:var(--acc);color:var(--on);font-weight:800;padding:14px 22px}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1}
.seg button.on{background:var(--acc);color:var(--on)}
#cats{overflow-x:auto}#cats button{flex:none;white-space:nowrap;border-radius:999px;padding:6px 14px}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--hd);border-top:3px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center}
#tot{font-size:26px;font-family:Chango,"Arial Black",Impact,sans-serif}
#pay{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));text-align:center}
.big{font-size:46px;font-family:Chango,"Arial Black",Impact,sans-serif;color:var(--acc)}
.scan{font-weight:800;letter-spacing:.08em;margin:8px 0}
#qrImg{width:min(78vw,340px);background:#fff;padding:8px;border-radius:16px;border:2px solid var(--line)}
input,textarea{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin:4px 0 10px}
label{display:block;font-size:14px;color:var(--mut)}
.chg{font-size:22px;font-weight:700;margin:8px 0}
.two{display:flex;gap:10px;margin-top:14px}.two button{flex:1}.two input{margin:0;flex:2}
.staff{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.av{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:var(--hd);display:grid;place-items:center;overflow:hidden;font-size:26px}
.av img{width:100%;height:100%;object-fit:cover}
.who{flex:1;min-width:140px}
.acts{display:flex;gap:6px;width:100%}.acts button{flex:1;font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:18px}
.x{color:var(--bad)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;z-index:30;max-width:90vw;font-size:14px}
</style>
</head>
<body>
<header>
  <div class="top"><span id="logo"></span><b id="biz">POS</b><small id="st"></small></div>
  <nav id="tabs"><button data-v="sale" class="on">Benta</button><button data-v="staff">Staff</button><button data-v="day">Araw</button><button data-v="set">Settings</button></nav>
</header>
<main>
  <div id="dbar" class="card" hidden><label>Petsa<input type="date" id="dsel"></label></div>
  <section id="sale"><div id="ot" class="seg"><button data-t="Dine in" class="on">Dine in</button><button data-t="Takeout">Takeout</button><button data-t="Delivery">Delivery</button></div><div id="cats" class="seg"></div><div id="menu" class="grid"></div><div class="card" id="cart"></div><div class="two"><input id="hl" placeholder="Mesa / pangalan (open ticket)"><button id="hold">I-hold</button></div><div class="two"><button id="tkts">Mga hold (0)</button></div><div class="card" id="tl" hidden></div></section>
  <section id="staff" hidden></section>
  <section id="day" hidden>
    <div class="stats" id="dsum"></div>
    <div class="card" id="cashc"><b>Kaha (Shift)</b>
      <label>Panimulang cash<input id="cs" type="number" inputmode="decimal"></label>
      <label>Halaga (Pay in / Pay out)<input id="ca" type="number" inputmode="decimal"></label>
      <label>Dahilan (hal. bumili ng yelo)<input id="cc"></label>
      <div class="two" id="cm"><button data-m="in">Pay in</button><button data-m="out">Pay out</button></div>
      <div id="cl"></div>
      <div class="row"><span>Dapat nasa kaha</span><b id="cx"></b></div>
      <label>Aktwal na bilang<input id="cact" type="number" inputmode="decimal"></label>
      <div class="row"><span>Diperensya</span><b id="cdf"></b></div>
    </div>
    <div class="card"><div id="olist"></div></div>
    <div class="card"><label>Para sa Daily sheet (Petsa, Items, Benta)<textarea id="tsv" rows="1" readonly></textarea></label><button id="copy" class="pri">Kopyahin</button></div>
  </section>
  <section id="set" hidden><div class="card">
    <label>Pangalan ng negosyo<input id="sName"></label>
    <label>Suki discount (%) — 0 kung walang discount<input id="sSuki" type="number" inputmode="decimal"></label>
    <label>Mensahe sa customer (lalabas sa bayaran)<input id="sPromo"></label>
    <label>Menu: isang item kada linya (Pangalan, presyo, Category)<textarea id="sMenu" rows="12"></textarea></label>
    <label>Staff: isang pangalan kada linya<textarea id="sStaff" rows="4"></textarea></label>
    <label>Logo ng shop<input id="lgf" type="file" accept="image/*"></label>
    <label>GCash QR<input id="qrf" type="file" accept="image/*"></label>
    <div id="qrPrev"></div>
    <button id="save" class="pri">I-save</button>
  </div></section>
</main>
<div id="bar"><div><small>Total</small><div id="tot">₱0</div></div><button id="payBtn" class="pri">BAYAD</button></div>
<div id="pay" hidden>
  <div class="mut" id="pBiz"></div>
  <div class="big" id="pTot"></div>
  <div id="pm" class="seg"><button data-m="cash" class="on">Cash</button><button data-m="gcash">GCash</button></div>
  <div id="dsc" class="seg"><button data-d="0" class="on">Walang diskwento</button><button data-d="1"></button></div>
  <div id="cashBox">
    <input id="rec" type="number" inputmode="decimal" placeholder="Natanggap (₱)">
    <div id="quick" class="seg"><button data-a="x">Eksakto</button><button data-a="50">+50</button><button data-a="100">+100</button><button data-a="500">+500</button><button data-a="1000">+1000</button></div>
    <div class="chg" id="chg"></div>
  </div>
  <div id="qrBox" hidden><div class="scan">SCAN FOR PAYMENT</div><img id="qrImg" alt="GCash QR" hidden><p id="noqr" class="mut">Ilagay ang GCash QR sa Settings.</p></div>
  <p id="promo" class="mut"></p>
  <div class="two"><button id="cancel">Balik</button><button id="done" class="pri">TAPOS</button></div>
</div>
<input type="file" id="cam" accept="image/*" capture="user" hidden>
<div id="toast" hidden></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var peso=function(n){return "₱"+(+n).toLocaleString("en-PH",{maximumFractionDigits:2})};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var pad=function(n){return String(n).padStart(2,"0")};
var dkey=function(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var DEF={name:"TEAse Me Cafe",menu:[{n:"Choco Lava 16oz",p:55,c:"Milk tea"},{n:"Choco Lava 22oz",p:75,c:"Milk tea"},{n:"Brownie Butterscotch 22oz",p:129,c:"Frappe"},{n:"Matcha Madness 22oz",p:129,c:"Frappe"},{n:"Cornetto Frappe 22oz",p:139,c:"Frappe"},{n:"Ube Supreme 22oz",p:119,c:"Frappe"},{n:"Chicken Poppers",p:80,c:"Rice meals"},{n:"Chicken Fillet Ala King",p:99,c:"Rice meals"},{n:"Pork Tonkatsu",p:80,c:"Rice meals"},{n:"Chicken Onion Rings",p:105,c:"Snacks"}],staff:["Staff 1","Staff 2"],qr:"",logo:"",suki:0,hold:[],promo:"Salamat po! TEAse Me and Take a Sip!!"};
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var S=Object.assign({},DEF,lsGet("tm_settings")||{}),D={orders:[],att:{}},day=dkey(),cart={},DB=null,q=Promise.resolve(),view="sale",method="cash",rec=0,camFor=null;
var isToday=function(){return day===dkey()};
var msg=function(t){$("#st").textContent=t};
function toast(t){var e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},2600)}

async function pull(path,ls){
  if(DB){try{var s=await DB.doc(path).get();if(s.exists)return s.data()}catch(e){}}
  return lsGet(ls);
}
function push(path,ls,obj){
  lsSet(ls,obj);
  if(DB){q=q.then(function(){return DB.doc(path).set(obj)}).then(function(){msg("")},function(){msg("Hindi na-save sa cloud")})}
}
var saveS=function(){push("settings/main","tm_settings",S)};
var saveD=function(){push("days/"+day,"tm_day_"+day,D)};
async function loadDay(k){
  day=k;
  var d=await pull("days/"+k,"tm_day_"+k);
  D=d||{orders:[],att:{}};D.orders=D.orders||[];D.att=D.att||{};D.cash=D.cash||{s:0,mv:[],act:null};
  render();
}

/* ---------- sale ---------- */
var total=function(){return Object.values(cart).reduce(function(a,c){return a+c.p*c.q},0)};
var otype="Dine in",dOn=false,cat="";
var net=function(){return dOn&&S.suki?Math.round(total()*(100-S.suki))/100:total()};
function otUI(){document.querySelectorAll("#ot button").forEach(function(b){b.classList.toggle("on",b.dataset.t===otype)})}
$("#cats").onclick=function(e){var b=e.target.closest("button");if(b){cat=b.dataset.c;menuUI()}};
$("#ot").onclick=function(e){var b=e.target.closest("button");if(b){otype=b.dataset.t;otUI()}};
function holdUI(){
  var H=S.hold||[];$("#tkts").textContent="Mga hold ("+H.length+")";
  $("#tl").innerHTML=H.length?H.map(function(h,i){var n=Object.values(h.cart).reduce(function(a,c){return a+c.q},0);return '<div class="row"><span><b>'+esc(h.l)+'</b><br><small>'+esc(h.ty)+' · '+n+' item</small></span><span><button data-r="'+i+'">Buksan</button> <button class="x" data-x="'+i+'">✕</button></span></div>'}).join(""):'<span class="mut">Walang naka-hold.</span>';
}
$("#hold").onclick=function(){
  if(!Object.keys(cart).length){toast("Walang laman ang order");return}
  S.hold=S.hold||[];
  S.hold.push({id:Date.now(),l:$("#hl").value.trim()||"Order "+(S.hold.length+1),ty:otype,cart:cart});
  $("#hl").value="";saveS();cart={};render();toast("Na-hold ang order");
};
$("#tkts").onclick=function(){$("#tl").hidden=!$("#tl").hidden};
$("#tl").onclick=function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.r!==undefined){
    if(Object.keys(cart).length){toast("I-hold o tapusin muna ang kasalukuyang order");return}
    var h=S.hold.splice(+b.dataset.r,1)[0];cart=h.cart;otype=h.ty;saveS();$("#tl").hidden=true;render();
  }else if(b.dataset.s){S.hold.splice(+b.dataset.x,1);saveS();render()}
  else{b.dataset.s=1;b.textContent="Sigurado?"}
};
function menuUI(){
  var cs=[];S.menu.forEach(function(m){if(m.c&&cs.indexOf(m.c)<0)cs.push(m.c)});
  if(cat&&cs.indexOf(cat)<0)cat="";
  $("#cats").hidden=!cs.length;
  $("#cats").innerHTML=[""].concat(cs).map(function(c){return '<button data-c="'+esc(c)+'"'+(c===cat?' class="on"':"")+'>'+(c?esc(c):"Lahat")+'</button>'}).join("");
  $("#menu").innerHTML=S.menu.map(function(m,i){return (!cat||m.c===cat)?'<button class="item" data-i="'+i+'"><span>'+esc(m.n)+'</span><b>'+peso(m.p)+'</b></button>':""}).join("");
}
function cartUI(){
  var L=Object.values(cart);
  $("#cart").innerHTML=L.length?L.map(function(c){var k=esc(c.n);return '<div class="row"><span>'+k+'</span><span class="qty"><button data-k="'+k+'" data-d="-1">−</button><b>'+c.q+'</b><button data-k="'+k+'" data-d="1">+</button></span><span>'+peso(c.p*c.q)+'</span></div>'}).join(""):'<span class="mut">Tap ang item para idagdag.</span>';
  $("#tot").textContent=peso(total());
  $("#payBtn").disabled=!L.length;
}
$("#menu").onclick=function(e){
  var b=e.target.closest(".item");if(!b)return;
  var m=S.menu[+b.dataset.i];
  (cart[m.n]=cart[m.n]||{n:m.n,p:m.p,q:0}).q++;
  cartUI();
};
$("#cart").onclick=function(e){
  var b=e.target.closest("button");if(!b)return;
  var key=b.dataset.k,c=cart[key];if(!c)return;
  c.q+=+b.dataset.d;if(c.q<=0)delete cart[key];
  cartUI();
};
function chgUI(){
  var t=net(),ch=rec-t;
  $("#chg").textContent=rec?(ch>=0?"Sukli: "+peso(ch):"Kulang: "+peso(-ch)):"Ilagay ang natanggap";
  $("#done").disabled=method==="cash"&&rec<t;
}
function payUI(){
  $("#pTot").textContent=peso(net());
  var dd=Math.round(total()*(S.suki||0))/100;
  $("#dsc").hidden=!S.suki;
  $("#dsc").children[1].textContent="Suki −"+S.suki+"% (−"+peso(dd)+")";
  document.querySelectorAll("#dsc button").forEach(function(b){b.classList.toggle("on",(b.dataset.d==="1")===dOn)});
  document.querySelectorAll("#pm button").forEach(function(b){b.classList.toggle("on",b.dataset.m===method)});
  var c=method==="cash";
  $("#cashBox").hidden=!c;$("#qrBox").hidden=c;
  $("#rec").value=rec||"";
  if(S.qr){$("#qrImg").src=S.qr}else{$("#qrImg").removeAttribute("src")}
  $("#qrImg").hidden=!S.qr;$("#noqr").hidden=!!S.qr;
  $("#promo").textContent=S.promo||"";$("#pBiz").textContent=S.name;
  chgUI();
}
$("#payBtn").onclick=function(){rec=0;dOn=false;method="cash";payUI();$("#pay").hidden=false};
$("#cancel").onclick=function(){$("#pay").hidden=true};
$("#dsc").onclick=function(e){var b=e.target.closest("button");if(b){dOn=b.dataset.d==="1";rec=0;payUI()}};
$("#pm").onclick=function(e){var b=e.target.closest("button");if(b){method=b.dataset.m;payUI()}};
$("#quick").onclick=function(e){var b=e.target.closest("button");if(!b)return;rec=b.dataset.a==="x"?net():rec+(+b.dataset.a);payUI()};
$("#rec").oninput=function(e){rec=+e.target.value||0;chgUI()};
$("#done").onclick=function(){
  var t=net();
  D.orders.push({t:Date.now(),items:Object.values(cart),sub:total(),disc:dOn&&S.suki?S.suki:0,ty:otype,total:t,m:method,rec:method==="cash"?rec:t});
  saveD();cart={};dOn=false;$("#pay").hidden=true;render();toast("Na-save: "+peso(t));
};

/* ---------- staff ---------- */
var tm=function(t){return t?new Date(t).toLocaleTimeString("en-PH",{hour:"numeric",minute:"2-digit"}):"—"};
var hm=function(ms){var m=Math.max(0,Math.floor(ms/60000));return Math.floor(m/60)+"h "+(m%60)+"m"};
function worked(a){
  if(!a||!a.in)return 0;
  var end=a.out||Date.now(),b=0;
  (a.br||[]).forEach(function(x){b+=(x.e||end)-x.s});
  return end-a.in-b;
}
function staffUI(){
  var td=isToday();
  $("#staff").innerHTML=S.staff.length?S.staff.map(function(n){
    var a=D.att[n]||{},br=a.br||[],onb=br.some(function(x){return !x.e}),k=esc(n);
    var st=!a.in?"Wala pa":a.out?"Tapos na":onb?"Break":"Nasa trabaho";
    return '<div class="card staff"><div class="av">'+(a.si?'<img alt="" src="'+esc(a.si)+'">':"👤")+'</div><div class="who"><b>'+k+'</b><div class="mut">'+st+' · '+hm(worked(a))+'</div><div class="mut">In '+tm(a.in)+' · Out '+tm(a.out)+'</div></div><div class="acts">'+
      '<button data-n="'+k+'" data-a="in"'+(!td||a.in?" disabled":"")+'>IN</button>'+
      '<button data-n="'+k+'" data-a="br"'+(!td||!a.in||a.out?" disabled":"")+'>'+(onb?"TAPOS BREAK":"BREAK")+'</button>'+
      '<button data-n="'+k+'" data-a="out"'+(!td||!a.in||a.out?" disabled":"")+'>OUT</button></div></div>';
  }).join(""):'<div class="card mut">Magdagdag ng pangalan ng staff sa Settings.</div>';
}
$("#staff").onclick=function(e){
  var b=e.target.closest("button");if(!b||b.disabled)return;
  var n=b.dataset.n,a=D.att[n]=D.att[n]||{br:[]},now=Date.now();
  a.br=a.br||[];
  var open=a.br.filter(function(x){return !x.e})[0];
  if(b.dataset.a==="in"){a.in=now;camFor={n:n,k:"si"}}
  else if(b.dataset.a==="br"){if(open)open.e=now;else a.br.push({s:now})}
  else{if(open)open.e=now;a.out=now;camFor={n:n,k:"so"}}
  saveD();render();
  if(b.dataset.a!=="br")$("#cam").click();
};
function fit(file,max,square,type){
  return new Promise(function(res){
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var c=document.createElement("canvas"),g=c.getContext("2d");
        if(square){var m=Math.min(im.width,im.height);c.width=c.height=max;g.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,max,max)}
        else{var s=Math.min(1,max/Math.max(im.width,im.height));c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height)}
        res(c.toDataURL(type,.6));
      };
      im.src=r.result;
    };
    r.readAsDataURL(file);
  });
}
$("#cam").onchange=function(e){
  var f=e.target.files[0];e.target.value="";
  if(!f||!camFor)return;
  var cf=camFor;
  fit(f,96,true,"image/jpeg").then(function(u){D.att[cf.n][cf.k]=u;saveD();render()});
};

/* ---------- day ---------- */
function dayUI(){
  var O=D.orders;
  var sum=function(f){return O.filter(f).reduce(function(a,o){return a+o.total},0)};
  var bowls=O.reduce(function(a,o){return a+o.items.reduce(function(x,i){return x+i.q},0)},0);
  var tot=sum(function(){return true});
  $("#dsum").innerHTML=[["Benta",peso(tot)],["Orders",O.length],["Items",bowls],["Cash",peso(sum(function(o){return o.m==="cash"}))],["GCash",peso(sum(function(o){return o.m==="gcash"}))],["Diskwento",peso(O.reduce(function(a,o){return a+(o.sub?o.sub-o.total:0)},0))]].map(function(x){return '<div class="stat"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>'}).join("");
  $("#olist").innerHTML=O.length?O.map(function(o,i){return {o:o,i:i}}).reverse().map(function(x){
    var o=x.o;
    return '<div class="row"><span>#'+(x.i+1)+' '+tm(o.t)+(o.ty?" · "+esc(o.ty):"")+'<br><small>'+esc(o.items.map(function(i){return i.q+"× "+i.n}).join(", "))+(o.disc?" · Suki −"+o.disc+"%":"")+'</small></span><span>'+peso(o.total)+'<br><small>'+(o.m==="cash"?"Cash":"GCash")+'</small></span>'+(isToday()?'<button class="x" data-i="'+x.i+'">Void</button>':"")+'</div>';
  }).join(""):'<span class="mut">Wala pang order.</span>';
  $("#tsv").value=day+"\t"+bowls+"\t"+tot;
  cashUI();
}
function cashCalc(){
  var C=D.cash,cs=D.orders.filter(function(o){return o.m==="cash"}).reduce(function(a,o){return a+o.total},0);
  var ex=(+C.s||0)+cs+C.mv.reduce(function(a,m){return a+m.a},0);
  $("#cx").textContent=peso(ex);
  var df=C.act===null||C.act===undefined?null:C.act-ex;
  $("#cdf").textContent=df===null?"—":(df<0?"−":df>0?"+":"")+peso(Math.abs(df));
  $("#cdf").className=df&&df<0?"x":"";
}
function cashUI(){
  var C=D.cash=D.cash||{s:0,mv:[],act:null},td=isToday();C.mv=C.mv||[];
  $("#cs").value=C.s||"";$("#cact").value=C.act===null||C.act===undefined?"":C.act;
  ["#cs","#cact","#ca","#cc"].forEach(function(k){$(k).disabled=!td});
  document.querySelectorAll("#cm button").forEach(function(b){b.disabled=!td});
  $("#cl").innerHTML=C.mv.map(function(m){return '<div class="row"><span>'+tm(m.t)+' · '+(m.a>0?"Pay in":"Pay out")+(m.c?" · "+esc(m.c):"")+'</span><b>'+peso(Math.abs(m.a))+'</b></div>'}).join("");
  cashCalc();
}
$("#cs").oninput=function(e){D.cash.s=+e.target.value||0;cashCalc()};
$("#cact").oninput=function(e){D.cash.act=e.target.value===""?null:+e.target.value;cashCalc()};
$("#cs").onchange=$("#cact").onchange=function(){saveD()};
$("#cm").onclick=function(e){
  var b=e.target.closest("button");if(!b)return;
  var a=+$("#ca").value;if(!(a>0)){toast("Ilagay ang halaga");return}
  D.cash.mv.push({t:Date.now(),a:b.dataset.m==="in"?a:-a,c:$("#cc").value.trim()});
  $("#ca").value="";$("#cc").value="";saveD();cashUI();
};
$("#olist").onclick=function(e){
  var b=e.target.closest(".x");if(!b)return;
  if(b.dataset.s){D.orders.splice(+b.dataset.i,1);saveD();render()}
  else{b.dataset.s=1;b.textContent="Sigurado?"}
};
$("#copy").onclick=async function(){
  var t=$("#tsv");
  try{await navigator.clipboard.writeText(t.value);toast("Na-kopya. I-paste sa Daily sheet.")}
  catch(e){t.select();try{document.execCommand("copy");toast("Na-kopya.")}catch(_){toast("Piliin at kopyahin nang mano-mano.")}}
};
$("#dsel").onchange=function(e){if(e.target.value)loadDay(e.target.value)};

/* ---------- settings ---------- */
function qrPrev(){
  $("#qrPrev").innerHTML=S.qr?'<img alt="GCash QR" style="width:140px;background:#fff;padding:6px;border-radius:8px"><br><button id="qrx">Alisin ang QR</button>':"";
  if(S.qr){$("#qrPrev img").src=S.qr}
}
$("#qrPrev").onclick=function(e){if(e.target.id==="qrx"){S.qr="";saveS();qrPrev()}};
$("#lgf").onchange=function(e){var f=e.target.files[0];e.target.value="";if(!f)return;fit(f,160,true,"image/jpeg").then(function(u){S.logo=u;saveS();render();toast("Na-save ang logo")})};
$("#qrf").onchange=function(e){
  var f=e.target.files[0];e.target.value="";if(!f)return;
  fit(f,480,false,"image/png").then(function(u){S.qr=u;saveS();qrPrev();toast("Na-save ang QR")});
};
function setUI(){
  $("#sName").value=S.name;$("#sSuki").value=S.suki;$("#sPromo").value=S.promo||"";
  $("#sMenu").value=S.menu.map(function(m){return m.n+", "+m.p+(m.c?", "+m.c:"")}).join("\n");
  $("#sStaff").value=S.staff.join("\n");qrPrev();
}
$("#save").onclick=function(){
  var menu=$("#sMenu").value.split("\n").map(function(l){return l.split(",").map(function(s){return s.trim()})}).filter(function(p){return p[0]&&p[1]!==""&&p[1]!==undefined&&!isNaN(+p[1])}).map(function(p){return {n:p[0],p:+p[1],c:p[2]||""}});
  if(!menu.length){toast("Kailangan ng kahit isang item: Pangalan, presyo");return}
  S=Object.assign({},S,{name:$("#sName").value.trim()||DEF.name,promo:$("#sPromo").value.trim(),menu:menu,suki:Math.max(0,Math.min(100,+$("#sSuki").value||0)),staff:$("#sStaff").value.split("\n").map(function(s){return s.trim()}).filter(Boolean)});
  saveS();render();toast("Na-save ang settings");
};

/* ---------- tabs ---------- */
function tabs(){
  ["sale","staff","day","set"].forEach(function(v){$("#"+v).hidden=v!==view});
  document.querySelectorAll("#tabs button").forEach(function(b){b.classList.toggle("on",b.dataset.v===view)});
  $("#bar").hidden=view!=="sale";
  $("#dbar").hidden=!(view==="staff"||view==="day");
  $("#dsel").value=day;
}
$("#tabs").onclick=function(e){
  var b=e.target.closest("button");if(!b)return;
  view=b.dataset.v;
  if(view==="set")setUI();
  if(view==="sale"&&!isToday()){loadDay(dkey());return}
  tabs();
};
function logoUI(){var l=$("#logo");l.textContent=S.logo?"":"💋";if(S.logo){var im=new Image();im.alt="";im.src=S.logo;im.style.cssText="width:100%;height:100%;object-fit:cover";l.appendChild(im)}}
function render(){$("#biz").textContent=S.name;logoUI();menuUI();cartUI();holdUI();otUI();staffUI();dayUI();tabs()}

render();
loadDay(day);
setInterval(function(){if(view==="staff"&&!document.hidden)staffUI()},60000);
try{
  if(window.claude&&window.claude.use){
    window.claude.use("db").then(async function(d){
      if(!d)return;
      DB=d;
      var s=await pull("settings/main","tm_settings");
      if(s)S=Object.assign({},DEF,s);
      await loadDay(day);
    }).catch(function(){});
  }
}catch(e){}
})();
</script>
</body>
</html>
